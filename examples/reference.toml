# ─── Top level ───────────────────────────────────────────────────────────────

# version =                      # 1
# name =                         # string — container/unit name; file name is leading after merge

# ─── Graph (module build-time only) ─────────────────────────────────────────

# [parents]
# add =                          # ["base/name"]   — inherit from these nodes
# remove =                       # ["base/name"]   — remove inherited nodes
# set =                          # ["base/name"]   — replace entire parent list

# [children]
# add =                          # ["child/name"]
# remove =                       # ["child/name"]
# set =                          # ["child/name"]

# ─── Deploy ──────────────────────────────────────────────────────────────────

# [deploy]
# enable =                       # true | false    — whether the NixOS/HM module deploys this unit
# target =                       # system | user   — system = /etc/containers/systemd/, user = ~/.config/containers/systemd/

# ─── Validation ──────────────────────────────────────────────────────────────

# [validation]
# level =                        # off | warn | strict

# ─── Runtime (graft-specific) ────────────────────────────────────────────────

# [config.runtime]
# mode =                         # rootfs-store    — only supported mode today
# packages =                     # ["bashInteractive", "coreutils", "git"]
# command =                      # ["bash", "-c", "sleep infinity"]

# [config.runtime.packageOps]    # module build-time mutations applied after graph merge
# add =                          # ["pkg"]
# remove =                       # ["pkg"]
# [[config.runtime.packageOps.replace]]
# name =                         # string          — package to replace
# with =                         # string          — replacement package

# ─── Container ───────────────────────────────────────────────────────────────

# [config.container]
# name =                         # string          — override container name (default: systemd-<unitname>)
# serviceName =                  # string          — override systemd service unit name (no .service suffix)
# hostname =                     # string          — hostname inside the container
# pod =                          # string          — attach to existing .pod unit (e.g. "mypod.pod")
# startWithPod =                 # true | false    — start/stop/restart with associated pod (default: true)
# entrypoint =                   # ["string"]      — override image ENTRYPOINT
# stopSignal =                   # SIGTERM | SIGKILL | SIGINT | SIGUSR1 | ...
# stopTimeout =                  # int             — seconds to wait before forcibly killing (default: 10)
# workingDir =                   # string          — working directory inside container (default: /)
# user =                         # string | int    — UID to run as inside container
# group =                        # string | int    — GID (requires user= to also be set)
# groupAdd =                     # ["keep-groups"] — additional groups for the primary user
# timezone =                     # local | UTC | Europe/Amsterdam | America/New_York | ...
# notify =                       # container | healthy  — sd_notify mode (healthy requires health check)
# runInit =                      # true | false    — run minimal init as PID 1 (default: false)
# httpProxy =                    # true | false    — pass host proxy env vars into container
# imageVolume =                  # bind | tmpfs | ignore  — how to handle builtin image volumes (default: bind)
# pull =                         # always | missing | never | newer  — image pull policy
# retry =                        # int             — retries on HTTP error when pulling image
# retryDelay =                   # string          — delay between retries (e.g. "5s")
# autoUpdate =                   # registry | local  — auto-update policy (podman-auto-update)
# cgroupsMode =                  # enabled | disabled | no-conmon | split  — cgroups mode (default for Quadlet: split)
# reloadCmd =                    # string          — command for ExecReload via podman exec (mutually exclusive with reloadSignal)
# reloadSignal =                 # string          — signal for ExecReload via podman kill (mutually exclusive with reloadCmd)
# logDriver =                    # journald | k8s-file | none | passthrough | ...
# logOpt =                       # ["path=/var/log/container.json"]  — log driver options (repeatable)
# podmanArgs =                   # ["--arg"]       — extra args appended right before image name in podman run
# globalArgs =                   # ["--arg"]       — extra args inserted between 'podman' and 'run'
# ip =                           # string          — static IPv4 (e.g. "10.88.64.128")
# ip6 =                          # string          — static IPv6 (e.g. "fd46:db93:aa76:ac37::10")
# networkAlias =                 # ["alias"]       — network-scoped DNS aliases (repeatable)
# exposeHostPort =               # ["8080"]        — expose port range without publishing (e.g. "50-59")
# uidMap =                       # ["0:100000:65536"]  — UID mappings for user namespace (repeatable)
# gidMap =                       # ["0:100000:65536"]  — GID mappings for user namespace (repeatable)
# subUidMap =                    # string          — subuid file entry (e.g. "@user")
# subGidMap =                    # string          — subgid file entry
# shmSize =                      # string          — size of /dev/shm (e.g. "64m")
# sysctl =                       # ["net.ipv6.conf.all.disable_ipv6=1"]  — kernel parameters (repeatable)
# containersConfModule =         # ["/etc/nvd.conf"]  — containers.conf modules to load (repeatable)
# apparmor =                     # string          — AppArmor confinement profile (or "unconfined")
# environmentHost =              # true | false    — pass all host environment variables into container

# [config.container.annotations]  — OCI annotations
# key =                          # "value"

# [config.container.labels]       — OCI labels (used by e.g. autoUpdate, monitoring tools)
# key =                          # "value"

# [config.container.environment]  — environment variables
# KEY =                          # "value"

# environmentFile =              # ["/path/to/env-file"]  — line-delimited env files (repeatable)

# [config.container.health]
# cmd =                          # string          — health check command ("none" to disable)
# interval =                     # string          — time between checks (e.g. "30s"; "disable" to disable)
# timeout =                      # string          — max time per check (e.g. "10s")
# retries =                      # int             — failures before marking unhealthy
# startPeriod =                  # string          — grace period at startup (e.g. "5s")
# onFailure =                    # kill | restart | stop | none  — action on unhealthy
# logDestination =               # local | directory | events_logger  — health log destination
# maxLogCount =                  # int             — max log entries (0 = infinite, default: 5)
# maxLogSize =                   # int             — max log chars (0 = infinite, default: 500)
# startupCmd =                   # string          — separate startup health check command
# startupInterval =              # string          — startup check interval (or "disable")
# startupRetries =               # int             — max startup check retries
# startupSuccess =               # int             — successes needed to pass startup check
# startupTimeout =               # string          — timeout per startup check

# ─── Filesystem ──────────────────────────────────────────────────────────────

# [config.filesystem]
# readOnly =                     # true | false    — make rootfs read-only
# readOnlyTmpfs =                # true | false    — when readOnly=true, add rw tmpfs on /dev /run /tmp (default: true)
# tmpfs =                        # ["/tmp:size=512m,mode=1777"]  — tmpfs mounts (repeatable)
# mounts =                       # ["type=bind,src=/host,dst=/container,ro"]  — raw --mount strings (repeatable)

# [[config.filesystem.volumes]]   — bind mounts and named volumes (repeatable)
# source =                       # string          — host path, named volume, or .volume quadlet ref
# target =                       # string          — container path (required)
# mode =                         # string          — options: ro, rw, z, Z, O, U, nocopy, idmap, ...

# [[config.filesystem.devices]]   — device passthrough (repeatable)
# source =                       # string          — host device path (prefix with "-" to make optional)
# target =                       # string          — container device path
# permissions =                  # string          — r/w/m combinations (e.g. "rwm")

# ─── Network ─────────────────────────────────────────────────────────────────

# [config.network]
# mode =                         # bridge | host | none | slirp4netns | pasta | container:<name> | ns:<path>
# publish =                      # ["ip:hostPort:containerPort", "8080:80", "8443:443/tcp"]
# dns =                          # ["1.1.1.1", "8.8.8.8"]
# dnsOption =                    # ["ndots:1"]
# dnsSearch =                    # ["example.com", "internal.lan"]
# addHost =                      # ["hostname:ip"]

# [[config.networks]]             — extra Quadlet .network units (repeatable)
# name =                         # string
# driver =                       # bridge | macvlan | ipvlan  (default: bridge)
# internal =                     # true | false    — restrict external access
# ipv6 =                         # true | false    — enable dual-stack
# subnet =                       # string          — CIDR (e.g. "192.168.100.0/24")
# gateway =                      # string          — gateway IP
# ipRange =                      # string          — CIDR or startIP-endIP range
# dns =                          # ["1.1.1.1"]
# options =                      # string          — driver-specific options (e.g. "isolate=true")
# disableDns =                   # true | false
# ipamDriver =                   # host-local | dhcp | none
# interfaceName =                # string          — bridge interface or parent device for macvlan/ipvlan
# deleteOnStop =                 # true | false    — delete network when unit stops

# [config.networks.labels]
# key =                          # "value"

# [[config.volumes]]              — extra Quadlet .volume units (repeatable)
# name =                         # string
# driver =                       # string          — volume driver (or "image")
# copy =                         # true | false    — copy image content into volume on first run (default: true)
# options =                      # string          — mount options (mount -o)
# device =                       # string          — device path for filesystem-backed volumes
# type =                         # string          — filesystem type (mount -t)
# uid =                          # int             — UID that owns the volume mountpoint
# gid =                          # int             — GID that owns the volume mountpoint
# user =                         # string          — host user/UID passed to mount operation
# group =                        # string          — host group/GID passed to mount operation
# image =                        # string          — image ref when driver = "image"

# [config.volumes.labels]
# key =                          # "value"

# ─── Security ────────────────────────────────────────────────────────────────

# [config.security]
# dropCapabilities =             # ["all"] | ["NET_RAW", "SYS_ADMIN", "CAP_NET_BIND_SERVICE"]
# addCapabilities =              # ["NET_BIND_SERVICE", "CAP_DAC_OVERRIDE"]
# noNewPrivileges =              # true | false    — prevent setuid/file-cap privilege escalation (default: false)
# privileged =                   # true | false    — full host access, all caps, no seccomp (dangerous)
# seccompProfile =               # string          — path to seccomp JSON or "unconfined"
# apparmor =                     # string          — AppArmor profile or "unconfined"
# securityLabelDisable =         # true | false    — disable SELinux/AppArmor label separation
# securityLabelFileType =        # string          — SELinux file type (e.g. "usr_t")
# securityLabelLevel =           # string          — SELinux level (e.g. "s0:c1,c2")
# securityLabelNested =          # true | false    — allow nested security labels inside container
# securityLabelType =            # string          — SELinux process type (e.g. "spc_t")
# securityOpt =                  # ["no-new-privileges", "label=disable", "mask=/proc/sys/foo"]  — raw --security-opt (repeatable)
# userns =                       # keep-id | auto | keep-id:uid=200,gid=210 | host | ns:<path> | nomap
# mask =                         # ["/proc/sys/foo:/proc/sys/bar"]  — paths to mask (colon-separated)
# unmask =                       # ["ALL"] | ["/proc/acpi:/proc/kcore"]  — paths to unmask

# ─── Resources ───────────────────────────────────────────────────────────────

# [config.resources]
# memory =                       # string          — memory limit (e.g. "512m", "2g", "-1" for unlimited)
# memorySwap =                   # string          — total memory + swap limit
# cpus =                         # string          — CPU quota as decimal (e.g. "0.5" = 50% of one core)
# cpuQuota =                     # string          — raw CPU quota
# pidsLimit =                    # int             — max PIDs (0 = unlimited, -1 = no limit)
# ulimits =                      # ["nofile=1024:1024", "nproc=512:1024"]  — ulimit options (repeatable)

# ─── Secrets ─────────────────────────────────────────────────────────────────

# [[config.secrets]]              — references only — never put secret bytes here (repeatable)
# name =                         # string          — Podman secret name
# target =                       # string          — path inside container or env var name
# type =                         # mount | env
# uid =                          # int             — UID for secret file
# gid =                          # int             — GID for secret file
# mode =                         # string          — file permissions (e.g. "0400")
# options =                      # string          — extra secret options

# ─── Workspace (CLI, runtime only) ───────────────────────────────────────────

# [config.workspace]
# mode =                         # none (default) | copy  — copy source tree into isolated workspace
# source =                       # string          — host path to copy (default: ".")
# target =                       # string          — mount point inside container (default: "/workspace")
# review =                       # diff            — print diff on exit
# promote =                      # off | prompt | auto  — what to do with changes after exit
# excludePatterns =              # [".git", ".jj", ".direnv", "result", "node_modules"]

# ─── Home (CLI, runtime only) ────────────────────────────────────────────────

# [config.home]
# mode =                         # ephemeral | persistent | session
#                                #   ephemeral  — temp dir, wiped on each run
#                                #   persistent — host dir survives across runs
#                                #   session    — copy on start, review/promote on stop
# source =                       # string          — host path for persistent/session (supports "~")
# target =                       # string          — mount point inside container (default: "/home/user")
# review =                       # diff            — print diff before promote step (session only)
# promote =                      # auto | prompt | never  — what to do with session changes on stop
# ephemeral =                    # true | false    — legacy alias for mode = "ephemeral"

# [[config.home.shadow]]          — extra writable paths, isolated per session (repeatable)
# container =                    # string          — path inside container (e.g. "/workspace")
# host =                         # string          — host directory to seed from (supports "~")

# ─── Attach (CLI, runtime only) ──────────────────────────────────────────────

# [config.attach]
# tmuxSession =                  # string          — tmux session name to attach to or create (default: "main")
# shell =                        # string          — fallback shell when tmux is unavailable (default: $SHELL or "sh")
# startDelay =                   # string          — wait after graft up before attaching (e.g. "500ms", "2s")

# ─── Service ─────────────────────────────────────────────────────────────────

# [config.service]
# type =                         # oneshot | notify  — service type (default: notify for containers)
# restart =                      # on-failure | always | no | on-success | on-abnormal | on-watchdog | on-abort
# restartSec =                   # string          — delay between restarts (e.g. "10s")
# timeoutStartSec =              # string          — start timeout (default: 90s; "infinity" for oneshot)
# timeoutStopSec =               # string          — stop timeout (e.g. "30s")
# remainAfterExit =              # true | false    — keep service active after container exits (recommended with oneshot)
# restartIfChanged =             # true | false    — restart on nixos-rebuild switch (default: true)

# ─── Quadlet passthrough ──────────────────────────────────────────────────────
# Raw INI key=value pairs written verbatim into the generated Quadlet file.
# Escape hatch for options graft does not model yet.
# [config.quadlet.container] must not set keys graft owns:
#   Rootfs, ContainerName, Exec, Network, Volume

# [config.quadlet.container]
# Key = ["value"]

# [config.quadlet.service]
# Key = ["value"]

# [config.quadlet.install]
# Key = ["value"]
